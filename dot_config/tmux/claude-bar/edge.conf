# Shared by both themes: per-window colors from the Claude state (see claude-tmux).
set -g @cb_fg "#{?#{m/r:^(ask|done)$,#{@claude_state}},#f38ba8,#{?#{==:#{@claude_state},busy},#f9e2af,#{?#{==:#{@claude_state},idle},#a6e3a1,#cdd6f4}}}"
set -g @cb_solid "#{?#{m/r:^(ask|done)$,#{@claude_state}},#f38ba8,#{?#{==:#{@claude_state},busy},#f9e2af,#{?#{==:#{@claude_state},idle},#a6e3a1,#89b4fa}}}"
set -g @cb_tint "#{?#{m/r:^(ask|done)$,#{@claude_state}},#3b1d2b,#{?#{==:#{@claude_state},busy},#352f1f,#{?#{==:#{@claude_state},idle},#13302b,#1c2b3d}}}"
set -g status-style "bg=#011628,fg=#cdd6f4"
set -g status-right "#{E:@claude_right}"
set -g status-right-length 120


# Edge marks: a thin colored bar in front of each window carries the state; names stay
# white (red windows also turn their name red). The current window sits on a navy tab.
set -g @cb_edge_name "#{?#{m/r:^(ask|done)$,#{@claude_state}},#[fg=#f38ba8#,bold],#[fg=#cdd6f4]}"
set -g window-status-separator " "
set -g window-status-format " #[fg=#{E:@cb_solid},bg=#011628]▎#{E:@cb_edge_name}#W #[fg=#585b70,nobold]#I "
set -g window-status-current-format " #[fg=#{E:@cb_solid},bg=#0d2a45]▎#{E:@cb_edge_name}#[bold]#W #[fg=#7f849c,nobold]#I #[bg=#011628]"
